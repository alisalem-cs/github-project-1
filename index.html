<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">

            <a href="#" class="logo">
                <i class="fa-solid fa-book-open"></i>
                Digital<span>Library.</span>
            </a>

            <ul class="nav-links">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#books">Books</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <a href="#books" class="nav-button">Explore Books</a>

        </nav>
    </header>


    <section class="hero">
        <div class="hero-content">
            <span class="hero-tag">YOUR DIGITAL LIBRARY</span>

            <h1>
                Discover a World of
                <span>Knowledge</span>
            </h1>

            <p>
                Explore thousands of books, discover new ideas,
                and expand your knowledge — anytime, anywhere.
            </p>

            <div class="hero-search">
                <input type="text" placeholder="Search books, authors, or topics..." />
                <button>Search</button>
            </div>

            <div class="hero-buttons">
                <a href="#books" class="btn-primary">
                    Explore Books →
                </a>
                <a href="#about" class="btn-secondary">
                    Learn More
                </a>
            </div>
        </div>

        <div class="hero-image">
            <img src="./images/digital.png" alt="A collection of books" />
        </div>
    </section>

    
</body>
</html>
